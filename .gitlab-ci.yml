stages:
  - deploy

workflow:
  rules:
    # Push to main, or manual run via "Run pipeline" in the GitLab UI
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

build-and-deploy:
  stage: deploy
  image: node:20
  variables:
    UPLOAD_MODE: MAP_STORAGE
    UPLOAD_DIRECTORY: normalis
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run upload
